name: Build slim Zonos worker
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Private repo: fetch the prebuilt binaries with the job token instead of an anonymous URL.
      - run: gh release download ggml-cuda-sm86-sm89-96d9e0e --repo ${{ github.repository }} -p '*.tgz' -p 'libzyphra_textnorm.so.gz' -D slim
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: slim
          push: true
          tags: |
            ghcr.io/olegphenomenon/zonos3-worker:runpod-slim-${{ github.sha }}
            ttl.sh/zonos3-slim-${{ github.sha }}:24h
