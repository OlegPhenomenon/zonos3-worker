name: Build studio-prep worker
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Bandit v2 speech branch as ONNX (studio/tool/export_bandit.py, CC BY-SA 4.0): release asset, private repo, job token.
      - run: gh release download bandit-v2-speech-onnx --repo ${{ github.repository }} -p 'bandit_speech.onnx' -D studio/models
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: studio
          push: true
          tags: ghcr.io/olegphenomenon/zonos3-worker:studio-${{ github.sha }}
