name: Persist image to GHCR
on:
  workflow_dispatch:
    inputs:
      source:
        description: Built image to copy (e.g. ttl.sh/...:24h)
        required: true
      tag:
        description: GHCR tag for ghcr.io/olegphenomenon/zonos3-worker
        required: true
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Copies the manifest and layers registry-to-registry; nothing is rebuilt.
      - run: docker buildx imagetools create --tag "ghcr.io/olegphenomenon/zonos3-worker:${{ inputs.tag }}" "${{ inputs.source }}"
      - run: docker buildx imagetools inspect "ghcr.io/olegphenomenon/zonos3-worker:${{ inputs.tag }}"
